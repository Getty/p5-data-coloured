name    = Data-Coloured
author  = Torsten Raudssus <getty@cpan.org>
license = Perl_5
copyright_holder = Torsten Raudssus <torsten@raudssus.de> L<https://raudssus.de/>
copyright_year   = 2026

[@Author::GETTY]
; The SUPPORT section of the POD is generated by the bundle, it holds the
; issue tracker and the IRC channel. The channel was part of the hand-written
; SUPPORT section before, the options keep it in the generated one.
irc        = #vonbienenstock
irc_server = irc.freenode.net
irc_user   = Getty

; .claude/ holds the agent skills, rules and worker definitions used to work
; ON this distribution -- karr, perl-core, perl-pod, the data-coloured-worker
; brief. They belong in the repository, not in the tarball: 19 KB of 195 KB,
; about a tenth of the release, and of no use to anyone installing
; Data::Coloured. CLAUDE.md stays, it describes the architecture and is the
; one file a packager or contributor reads first. .worktreeinclude is the
; skilletor marker for the agent worktrees -- repo-only as well. The bundle
; ships a snapshot of the agent context in misc/agent-context/ for build
; provenance, it is not installed. (karr #8.)
[PruneFiles]
match = ^\.claude/
match = ^\.worktreeinclude$
